# llm-relay — example Dockge stack.
# Paste into Dockge as a new stack; create the .env next to it with the values
# below before the first start. Data persists in /docker/llm-proxy/data.
#
# Required .env keys:
#   JWT_SECRET        openssl rand -hex 32
#   ADMIN_USERNAME    first-run bootstrap admin
#   ADMIN_PASSWORD    first-run bootstrap admin password
# Optional: RELAY_PORT / DASHBOARD_PORT overrides if 8080/8081 are taken on the host.

services:
  llm-relay:
    image: gitea.rantaeskola.fi/gizmoz/llm-relay:latest
    container_name: llm-relay
    restart: unless-stopped
    ports:
      - "${RELAY_PORT:-8080}:8080"      # relay API (/v1/*) — friends' apps point here
      - "${DASHBOARD_PORT:-8081}:8081"  # dashboard + admin API
    environment:
      TZ: Europe/Helsinki
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — openssl rand -hex 32}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Keep false: the relay port is published directly to users, so
      # X-Forwarded-For there is client-controlled and spoofable. Only enable
      # if BOTH ports are reachable exclusively through your trusted proxy.
      TRUST_PROXY_HEADERS: "false"
      # URLs shown in the dashboard copy buttons and interpolated into the
      # agent guide (GET /v1/agent-guide). Include the scheme; a hostname or
      # a plain IP:port both work — direct LAN hosting is fine, e.g.
      # http://192.0.2.10:8080 (relay) and http://192.0.2.10:8081 (dashboard).
      # Unset: copy buttons stay empty; the guide keeps its {{RELAY_URL}}
      # placeholder (an unset dashboard URL drops its mention).
      PUBLIC_RELAY_URL: ${PUBLIC_RELAY_URL:-}
      PUBLIC_DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL:-}
    volumes:
      - /docker/llm-proxy/data:/data
