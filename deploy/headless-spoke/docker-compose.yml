# llm-relay — headless spoke: one local model, shared with a hub, no dashboard.
# Copy this file and .env.example (as .env) onto the machine that runs your
# engine, fill in .env, then:  docker compose up -d
# Docs: docs/workflows/headless-spoke.md
services:
  llm-relay:
    image: gitea.rantaeskola.fi/gizmoz/llm-relay:latest
    restart: unless-stopped
    ports:
      - "8080:8080"        # relay port only — a headless box never binds the admin port
    env_file: .env
    volumes:
      - ./data:/data
