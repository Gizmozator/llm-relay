# llm-relay — full relay server: dashboard + admin API, several models, users.
# Copy this file and .env.example (as .env) onto your server, fill in .env,
# then:  docker compose up -d   — open the dashboard at http://<host>:8081.
# Docs: README.md
services:
  llm-relay:
    image: gitea.rantaeskola.fi/gizmoz/llm-relay:latest
    restart: unless-stopped
    ports:
      - "8080:8080"   # relay API (/v1/*) — apps point here
      - "8081:8081"   # dashboard + admin API
      - "8443:8443"   # machine channels over TLS (federation + remote backends);
                      # drop this line and set TLS_PORT=0 in .env when a reverse
                      # proxy terminates TLS instead
    env_file: .env
    volumes:
      - ./data:/data
