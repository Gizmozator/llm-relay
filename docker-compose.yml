# llm-relay — local container stack. `make docker-up` is the entry point.
services:
  llm-relay:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE:-llm-relay:latest}
    container_name: llm-relay
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
      - "${ADMIN_PORT:-8081}:8081"
    environment:
      PORT: "8080"
      ADMIN_PORT: "8081"
      TZ: "${TZ:-Europe/Helsinki}"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"
      PUBLIC_RELAY_URL: "${PUBLIC_RELAY_URL:-}"
      PUBLIC_DASHBOARD_URL: "${PUBLIC_DASHBOARD_URL:-}"
    volumes:
      - llm-relay-data:/data
    # No healthcheck: the runtime image is `scratch` (no shell, no curl).
    # If you need one, switch the runtime stage to a distroless/base image or
    # add a healthcheck-capable probe endpoint to the binary.

volumes:
  llm-relay-data:
